services:
  postgres:
    image: postgres:17
    container_name: commercial-lending-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lending_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: commercial-lending-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lending_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: commercial-lending-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:
