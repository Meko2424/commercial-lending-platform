services:
  postgres:
    image: postgres:17
    container_name: commercial-lending-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lending_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: